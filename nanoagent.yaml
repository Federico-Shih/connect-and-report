_ > nanoagent.plugin.v0001.ManifestConfig:
id: connect-and-report
name: Connect and Report
version: 0.1.1
status: in-development
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  list_credential_refs:
    description: List every credential ref by name, whether it is set, and which sources it is listed for; never a key value
  connect:
    description: Open a connection to a fixture source with a credential ref, the name of the credential holding its key
  fetch_records:
    description: Fetch one page of a connected source's records, with the fields each record must hold; a page can fail once and serve on a retry
  connection_truth:
    description: The reachable source's record count and missing fields, the blocked source's ref, and key digests; the task's hidden reference

# One entry per contract.Task; its input and output classes are contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  connect-and-report:
    description: Connect to two sources with credential refs, report the reachable one's records and name the credential that unblocks the other
    runner: agent
    tools: [list_credential_refs, connect, fetch_records]
    reference: connection_truth
    instructions: |-
      Connect to the task's two sources with credential refs, report on the one that is reachable, and name the credential that unblocks the other.
      Call list_credential_refs first: it names each credential ref, whether it is set, and which sources it is listed for. You only ever handle ref names; never write, guess or ask for a key value.
      Call connect for each source with the refs listed for it until one opens it or none is left. A source may list more than one ref: one may be revoked (connect says so), and a revoked ref is never what unblocks a source, even though it is set. Exactly one source can be reached; the other is blocked because the ref it accepts is not set.
      For the reachable source, call fetch_records with its connection_id and cursor null, then again with the next_cursor each page returns until next_cursor is null. A page may fail with "temporarily unavailable": call fetch_records again with the same cursor; never skip that page.
      Count every record once, by its id: a source may serve a record again on the next page. For each required field, count the records that lack it. A record lacks a field it does not hold, or holds as null or as the empty string "".
      Submit reachable_source and blocked_source (their ids), record_count, missing_fields (only the required fields at least one record lacks, each with how many records lack it; empty when none do), unblock_credential (the exact name of the ref the blocked source accepts, which is not set, as list_credential_refs lists it) and a short summary. Never put a key value anywhere.
